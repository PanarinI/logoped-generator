<!-- Знак проекта. Выбран автором 2026-08-25 из четырёх вариантов.

     Звук в квадратных скобках — логопедическая нотация: специалист пишет звук
     именно так, [р]. Чужому человеку знак ни о чём не говорит, своему говорит
     сразу, и это ровно тот адресат, ради которого сделан инструмент.

     Прежняя заглушка (точка и две дуги) снята по слову автора: она читалась
     как значок вай-фая — «пиктограмма распространения сигнала».

     Проверено в трёх размерах: в 16 пикселях на вкладке скобки и буква
     остаются различимы, поэтому знак остаётся собой и там. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#2f6b4f"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 17h-6v30h6"/>
    <path d="M46 17h6v30h-6"/>
  </g>
  <text x="32" y="43" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="28" font-weight="700" fill="#fff">р</text>
</svg>
