<text x="34" y="40" font-size="23" font-weight="700" fill="#1c2024">Звуковая дорожка · семья А — полосы. Лист и экран</text>
<text x="34" y="64" font-size="13.5" fill="#6b7280">Оранжевым — то, чего сейчас нет. Лист АЛЬБОМНЫЙ: так устроены все многострочные образцы жанра.</text>
<text x="34" y="84" font-size="15" font-weight="700" fill="#1c2024">ЛИСТ — А4 альбомный, три дорожки по умолчанию</text>
