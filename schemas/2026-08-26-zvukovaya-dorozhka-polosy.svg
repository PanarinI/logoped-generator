<text x="50" y="532" font-size="8.5" fill="#6b7280">Взрослому. Слог на всех трёх дорожках один и тот же — меняется задача голосу…</text>
<text x="34" y="582" font-size="15" font-weight="700" fill="#1c2024">ЧТО СТОИТ В КОНЦЕ ЛИНИИ — одно место, два случая</text>
