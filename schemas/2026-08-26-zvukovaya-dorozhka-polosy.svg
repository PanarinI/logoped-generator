<text x="720" y="84" font-size="15" font-weight="700" fill="#1c2024">ЭКРАН — ОДНА новая ручка, и одна условная</text>
<rect x="720" y="96" width="370" height="330" rx="8" fill="#ffffff" stroke="#1c2024" stroke-width="1.6"/>
<text x="738" y="126" font-size="12.5" font-weight="700" fill="#1c2024">Где звук в слоге?</text>
