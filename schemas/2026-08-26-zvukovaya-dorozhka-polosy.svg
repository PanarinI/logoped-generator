<text x="920.1" y="201" font-size="10.5" text-anchor="middle" fill="#1c2024">Э</text>
<text x="738" y="230" font-size="12.5" font-weight="700" fill="#c2410c">Сколько дорожек?</text>
<rect x="738" y="237" width="22.6" height="24" rx="4" fill="#ffffff" stroke="#c9ccd1" stroke-width="1"/>
<text x="749.3" y="253" font-size="10.5" text-anchor="middle" fill="#1c2024">1</text>
<rect x="767.6" y="237" width="22.6" height="24" rx="4" fill="#ffffff" stroke="#c9ccd1" stroke-width="1"/>
<text x="778.9" y="253" font-size="10.5" text-anchor="middle" fill="#1c2024">2</text>
<rect x="797.2" y="237" width="22.6" height="24" rx="4" fill="#fdf0e8" stroke="#c2410c" stroke-width="1.6"/>
<text x="808.5" y="253" font-size="10.5" text-anchor="middle" fill="#1c2024">3</text>
<rect x="826.8000000000001" y="237" width="22.6" height="24" rx="4" fill="#ffffff" stroke="#c9ccd1" stroke-width="1"/>
<text x="838.1" y="253" font-size="10.5" text-anchor="middle" fill="#1c2024">4</text>
<text x="738" y="276" font-size="9.5" fill="#c2410c">одна дорожка = лист-спираль, целая картинка</text>
<rect x="732" y="284" width="346" height="52" rx="5" fill="#faf7f4" stroke="#c2410c" stroke-width="1" stroke-dasharray="4 3"/>
<text x="740" y="300" font-size="11.5" font-weight="700" fill="#c2410c">Линия</text>
<text x="788" y="300" font-size="9.5" fill="#6b7280">видна только при ОДНОЙ дорожке</text>
<rect x="738" y="309" width="75.8" height="24" rx="4" fill="#fdf0e8" stroke="#c2410c" stroke-width="1.6"/>
<text x="775.9" y="325" font-size="10.5" text-anchor="middle" fill="#1c2024">сплошная</text>
<rect x="820.8" y="309" width="68.19999999999999" height="24" rx="4" fill="#ffffff" stroke="#c9ccd1" stroke-width="1"/>
<text x="854.9" y="325" font-size="10.5" text-anchor="middle" fill="#1c2024">пунктир</text>
<text x="738" y="360" font-size="12.5" font-weight="700" fill="#1c2024">Цветной лист</text>
<rect x="738" y="367" width="45.4" height="24" rx="4" fill="#eef4f0" stroke="#2f6f4f" stroke-width="1.6"/>
<text x="760.7" y="383" font-size="10.5" text-anchor="middle" fill="#1c2024">выкл</text>
<rect x="790.4" y="367" width="37.8" height="24" rx="4" fill="#ffffff" stroke="#c9ccd1" stroke-width="1"/>
<text x="809.3" y="383" font-size="10.5" text-anchor="middle" fill="#1c2024">вкл</text>
<text x="720" y="448" font-size="15" font-weight="700" fill="#1c2024">ПОЧЕМУ РУЧЕК НЕ ТРИ, А ОДНА</text>
<circle cx="728" cy="468" r="3" fill="#2f6f4f"/>
<text x="740" y="472" font-size="11.5" font-weight="700" fill="#1c2024">Герой не выбирается</text>
<text x="740" y="487" font-size="10.5" fill="#6b7280">видов ровно 3, строк 3 — выбирать не из чего, они крутятся сами</text>
<circle cx="728" cy="508" r="3" fill="#2f6f4f"/>
<text x="740" y="512" font-size="11.5" font-weight="700" fill="#1c2024">Цель не выбирается</text>
<text x="740" y="527" font-size="10.5" fill="#6b7280">5 целей на героя, но какая куда — логопеду безразлично; меняются кубиком «собрать другой набор», он уже есть</text>
<circle cx="728" cy="548" r="3" fill="#2f6f4f"/>
<text x="740" y="552" font-size="11.5" font-weight="700" fill="#1c2024">Пунктир на полосах не ручка</text>
<text x="740" y="567" font-size="10.5" fill="#6b7280">это ПОСЛЕДНЯЯ ступень лестницы: ✅ у Поповой прерывистая — самый сложный вариант, он всегда в конце</text>
<circle cx="728" cy="588" r="3" fill="#2f6f4f"/>
<text x="740" y="592" font-size="11.5" font-weight="700" fill="#1c2024">Пунктир нужен только спирали</text>
<text x="740" y="607" font-size="10.5" fill="#6b7280">там линия ОДНА, и выбор настоящий — потому 14 листов в банке: 7 сплошных и 7 пунктирных</text>
<text x="720" y="644" font-size="11" fill="#2f6f4f" font-weight="700">Закон 13: где выбор безразличен — ручки нет, есть кубик.</text>
</svg>