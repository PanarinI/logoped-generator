<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6b4f"/>
    </marker>
  </defs>

  <rect width="1100" height="760" fill="#faf8f4"/>

  <text x="40" y="50" font-size="25" font-weight="600" fill="#1e2328">Веб-интерфейс: что видит логопед и что при этом делает машина</text>
  <text x="40" y="76" font-size="13.5" fill="#8a929c">2026-08-02 · три экрана · профиль ребёнка спрашивается ПОСЛЕ первого листа, а не до</text>

  <!-- верхняя дорожка: что видит логопед -->
  <text x="40" y="118" font-size="12.5" font-weight="600" fill="#8a929c" letter-spacing="1.2">ЧТО ВИДИТ ЛОГОПЕД</text>

  <rect x="40" y="132" width="230" height="104" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="60" y="160" font-size="14.5" font-weight="600" fill="#1e2328">1 · Какой звук?</text>
  <text x="60" y="186" font-size="22" font-weight="600" fill="#1e2328">Р &#160; С &#160; Ш</text>
  <text x="60" y="212" font-size="12" fill="#8a929c">три кнопки — ровно те звуки,</text>
  <text x="60" y="227" font-size="12" fill="#8a929c">под которые есть словарь</text>

  <rect x="300" y="132" width="300" height="104" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="320" y="160" font-size="14.5" font-weight="600" fill="#1e2328">2 · Что берём на лист?</text>
  <text x="320" y="188" font-size="20" font-weight="600" fill="#1e2328">РА &#160;АР &#160;АРА &#160;КРА &#160;АРТ</text>
  <text x="320" y="212" font-size="12" fill="#8a929c">на кнопке — настоящий слог, взятый</text>
  <text x="320" y="227" font-size="12" fill="#8a929c">из движка, а не придуманная подпись</text>

  <rect x="630" y="132" width="230" height="104" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="650" y="160" font-size="14.5" font-weight="600" fill="#1e2328">3 · Готовый лист</text>
  <text x="650" y="186" font-size="13" fill="#5b6470">A4, семь блоков, печать</text>
  <text x="650" y="208" font-size="12" fill="#8a929c">рядом — вкладка «Лабиринт»</text>
  <text x="650" y="223" font-size="12" fill="#8a929c">на том же звуке и профиле</text>

  <line x1="270" y1="184" x2="296" y2="184" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="600" y1="184" x2="626" y2="184" stroke="#5b6470" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- ров -->
  <rect x="890" y="132" width="170" height="104" rx="10" fill="#eaf2ed" stroke="#2f6b4f" stroke-width="1.5"/>
  <text x="908" y="158" font-size="14.5" font-weight="600" fill="#22523c">4 · И только теперь</text>
  <text x="908" y="180" font-size="12.5" fill="#2f6b4f">«какие ещё звуки</text>
  <text x="908" y="196" font-size="12.5" fill="#2f6b4f">не получаются?»</text>
  <text x="908" y="218" font-size="11.5" fill="#4a7c62">лист пересобирается</text>
  <text x="908" y="231" font-size="11.5" fill="#4a7c62">на глазах</text>
  <line x1="860" y1="184" x2="886" y2="184" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- почему после, а не до -->
  <rect x="40" y="262" width="1020" height="58" rx="10" fill="#fff6e6" stroke="#d9a441" stroke-width="1.4"/>
  <text x="62" y="288" font-size="13.5" font-weight="600" fill="#6b4c0c">Почему профиль спрашивается ПОСЛЕ, а не до (решение автора)</text>
  <text x="62" y="308" font-size="13" fill="#5f4a17">Форма из восьми полей на входе отпугнёт. Ров надо ПОКАЗАТЬ: сначала лист, потом «убрали 19 слов» — и материал на бумаге меняется прямо сейчас.</text>

  <!-- нижняя дорожка: что делает машина -->
  <text x="40" y="366" font-size="12.5" font-weight="600" fill="#8a929c" letter-spacing="1.2">ЧТО ПРИ ЭТОМ ДЕЛАЕТ МАШИНА</text>

  <rect x="40" y="382" width="1020" height="124" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="62" y="410" font-size="14" font-weight="600" fill="#1e2328">Один-единственный путь в движок — тот же, которым идёт чеклист брака</text>

  <rect x="62" y="426" width="215" height="60" rx="8" fill="#f4f5f7" stroke="#cfd4da"/>
  <text x="76" y="450" font-size="13" font-weight="600" fill="#3f4854">sheet.compose</text>
  <text x="76" y="470" font-size="11.5" fill="#69727e">звук · слог · профиль СТРОКОЙ</text>

  <rect x="307" y="426" width="215" height="60" rx="8" fill="#f4f5f7" stroke="#cfd4da"/>
  <text x="321" y="450" font-size="13" font-weight="600" fill="#3f4854">render_sheet_ex</text>
  <text x="321" y="470" font-size="11.5" fill="#69727e">вёрстка A4 + линтер внутри</text>

  <rect x="552" y="426" width="215" height="60" rx="8" fill="#f4f5f7" stroke="#cfd4da"/>
  <text x="566" y="450" font-size="13" font-weight="600" fill="#3f4854">HTML в рамке</text>
  <text x="566" y="470" font-size="11.5" fill="#69727e">то, что на экране = то, что печатается</text>

  <rect x="797" y="426" width="241" height="60" rx="8" fill="#eaf2ed" stroke="#9bc0aa"/>
  <text x="811" y="450" font-size="13" font-weight="600" fill="#22523c">предупреждения движка</text>
  <text x="811" y="470" font-size="11.5" fill="#3d7256">показываются все, без утайки</text>

  <line x1="277" y1="456" x2="303" y2="456" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="522" y1="456" x2="548" y2="456" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="767" y1="456" x2="793" y2="456" stroke="#5b6470" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- три ловушки -->
  <text x="40" y="548" font-size="12.5" font-weight="600" fill="#8a929c" letter-spacing="1.2">ТРИ ЛОВУШКИ, В КОТОРЫЕ ИНТЕРФЕЙС МОГ ПОПАСТЬ — И НЕ ПОПАЛ</text>

  <rect x="40" y="564" width="330" height="106" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="60" y="590" font-size="13.5" font-weight="600" fill="#1e2328">Профиль списком</text>
  <text x="60" y="612" font-size="12" fill="#5b6470">Из браузера звуки приходят списком.</text>
  <text x="60" y="628" font-size="12" fill="#5b6470">Движок список берёт как есть и НЕ</text>
  <text x="60" y="644" font-size="12" fill="#5b6470">фильтрует — молча, без ошибки.</text>
  <text x="60" y="662" font-size="12" font-weight="600" fill="#2f6b4f">Отдаём строкой «л,ш».</text>

  <rect x="385" y="564" width="330" height="106" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="405" y="590" font-size="13.5" font-weight="600" fill="#1e2328">«Ещё лист» через seed</text>
  <text x="405" y="612" font-size="12" fill="#5b6470">seed слова не меняет — логопед нажал</text>
  <text x="405" y="628" font-size="12" fill="#5b6470">бы «другие слова» и получил те же.</text>
  <text x="405" y="662" font-size="12" font-weight="600" fill="#2f6b4f">Крутим номер листа, он сдвигает срез.</text>

  <rect x="730" y="564" width="330" height="106" rx="10" fill="#fff" stroke="#e2ded6" stroke-width="1.5"/>
  <text x="750" y="590" font-size="13.5" font-weight="600" fill="#1e2328">Тихий брак</text>
  <text x="750" y="612" font-size="12" fill="#5b6470">Тяжёлый профиль отдаёт лист из 2 слов</text>
  <text x="750" y="628" font-size="12" fill="#5b6470">без единой ошибки. Канон — 12–24.</text>
  <text x="750" y="662" font-size="12" font-weight="600" fill="#2f6b4f">Печать блокируется, причина названа.</text>

  <rect x="40" y="694" width="1020" height="42" rx="10" fill="#fdeeee" stroke="#c9767a" stroke-width="1.4"/>
  <text x="62" y="720" font-size="13" fill="#7a2f34">Граница прежняя: интерфейс проверен машиной и мной. Живой логопед его не видел — это следующая проверка, и она главная.</text>
</svg>
