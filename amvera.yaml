# Конфигурация для Amvera Cloud (хостинг приложения с 2026-08-22).
#
# Файл нужен ровно из-за ОДНОЙ строки — порта. Amvera по умолчанию ждёт
# приложение на 80-м порту контейнера, а наш образ:
#   · слушает 8080 (Dockerfile: ENV PORT=8080, EXPOSE 8080);
#   · работает под непривилегированным пользователем `app` (uid 1000).
# Непривилегированный процесс порт ниже 1024 забиндить не может — без
# `containerPort` приложение собралось бы и запустилось, а снаружи отдавало бы
# пустоту, и искать причину пришлось бы в логах сборки, где её нет.
#
# Всё остальное Amvera берёт из Dockerfile: сборку описывать второй раз не надо,
# конфиг здесь минимальный намеренно.
#
# Почему Amvera, а не Timeweb App Platform: у Timeweb минимальная конфигурация
# App Platform (и фиксированная, и произвольная) — 510 ₽/мес, у Amvera тариф
# «Начальный» 290 ₽/мес. Тарификация поминутная, остановленный проект не
# тарифицируется. Разбор — DECISIONS 2026-08-22.

meta:
  environment: docker
  toolchain:
    name: docker

run:
  containerPort: 8080
  # Папка постоянного хранилища — единственное, что переживает пересборку
  # образа. С 08-25 туда пишутся ОТЗЫВЫ логопедов (`web/otzyv.py`,
  # `/data/otzyvy.jsonl`): всё остальное живёт внутри образа и стирается на
  # каждом выкате, а слова людей терять нельзя.
  # ✅ ПРОВЕРЕНО 08-25 на живых данных: первая запись в `otzyvy.jsonl` сделана
  # 08-25 00:42 (через три минуты после выката канала, коммит 10ae7ef 00:39),
  # и она лежит в том же файле, что запись 16:15 — а между ними ОДИННАДЦАТЬ
  # выкатов. Значит пишется именно постоянный диск: будь это запасной путь
  # внутри образа, первая запись стёрлась бы на выкате в 10:31.
  persistenceMount: /data
