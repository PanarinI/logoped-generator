<meta charset="utf-8">
<title>LogoKonspekt · генератор листов</title>
<style>
  body{margin:0;background:#eceff1;font-family:sans-serif;color:#333}
  h2{text-align:center;margin:18px}
  .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:24px;padding:20px}
  .sheet{background:#fff;box-shadow:0 3px 16px rgba(0,0,0,.18)}
  .sheet svg{display:block}
  .cap{text-align:center;font-size:13px;color:#666;margin-top:6px}
</style>

<!-- ============================================================= -->
<!--  ПАРАМЕТРЫ ЛИСТА  —  меняешь тут → получаешь лист под др. звук  -->
<!-- ============================================================= -->
<script>
const CONFIG = {
  targetSound: 'Р',                       // целевой звук
  instruction: 'веди пальцем и тяни: р-р-р',
  subtitle:    'заведи мотор',
  rowCount:    4,                         // сколько дорожек
  // строки: слог + иконка из базы + тип волны (нарастающая сложность)
  rows: [
    { syllable: 'РА', icon: 'car',    wave: 'sine-gentle' },
    { syllable: 'РО', icon: 'plane',  wave: 'sine-medium' },
    { syllable: 'РУ', icon: 'boat',   wave: 'sine-steep'  },
    { syllable: 'РЫ', icon: 'rocket', wave: 'loops'       },
  ],
  waveTypes: ['sine-gentle','sine-medium','sine-steep','loops'],
  // для «слогового поля»:
  fieldSyllables: ['РА','РО','РУ','РЫ','РЭ','АР','ОР','УР','ЫР',
                   'ТРА','ДРА','ТРО','ДРУ','ГРА','КРО','ВРЫ','БРА','ПРУ'],
  fieldCount: 15,
};

// пример смены параметров под ДРУГОЙ звук (доказательство параметризуемости):
const CONFIG_L = {
  targetSound:'Л', instruction:'веди пальцем и пой: л-л-л', subtitle:'плыви по волне',
  rowCount:4,
  rows:[
    { syllable:'ЛА', icon:'boat',   wave:'sine-gentle' },
    { syllable:'ЛО', icon:'plane',  wave:'sine-medium' },
    { syllable:'ЛУ', icon:'car',    wave:'sine-steep'  },
    { syllable:'ЛЫ', icon:'rocket', wave:'loops'       },
  ],
  waveTypes:['sine-gentle','sine-medium','sine-steep','loops'],
  fieldSyllables:['ЛА','ЛО','ЛУ','ЛЫ','АЛ','ОЛ','УЛ','ПЛА','КЛО','ГЛУ','СЛА','БЛЫ','ВЛО','ФЛА','ХЛУ'],
  fieldCount:15,
};
</script>

<!-- ============================================================= -->
<!--  ДВИЖОК  (заготовки-иконки + алгоритм «какое задание на линию») -->
<!-- ============================================================= -->
<script>
const W=794,H=1123;
const FONT="'Marker Felt','Comic Sans MS','Chalkboard SE','Arial Rounded MT Bold','Trebuchet MS',sans-serif";
const R=v=>Math.round(v);

// --- волны нарастающей сложности -----------------------------------
function sineD(x0,x1,yMid,amp,periods,steps){
  let d='';
  for(let i=0;i<=steps;i++){
    const t=i/steps, x=x0+(x1-x0)*t, y=yMid+amp*Math.sin(t*periods*2*Math.PI);
    d+=(i?'L':'M')+R(x)+' '+R(y)+' ';
  }
  return d.trim();
}
// петли-завитки (пролатная циклоида: точка вне катящегося круга → loop-de-loop)
function loopsD(x0,x1,yMid,amp,loops,steps){
  const thetaMax=loops*2*Math.PI, r=1, d0=2.2;
  const rx=t=>r*t-d0*Math.sin(t), ry=t=>-d0*Math.cos(t);
  const xMax=rx(thetaMax), sx=(x1-x0)/xMax, sy=amp/d0;
  let d='';
  for(let i=0;i<=steps;i++){
    const t=thetaMax*i/steps, x=x0+rx(t)*sx, y=yMid+ry(t)*sy;
    d+=(i?'L':'M')+R(x)+' '+R(y)+' ';
  }
  return d.trim();
}
function wavePath(type,x0,x1,y){
  switch(type){
    case 'sine-gentle': return sineD(x0,x1,y,13,2.5,40);
    case 'sine-medium': return sineD(x0,x1,y,23,3.5,48);
    case 'sine-steep':  return sineD(x0,x1,y,33,5,56);
    case 'loops':       return loopsD(x0,x1,y,30,4,150);
    default:            return sineD(x0,x1,y,18,3,40);
  }
}

// --- заготовки-иконки (простые узнаваемые, ч/б под печать) ----------
const IK={ // всё рисуется в боксе 0..96
  car:`<path d="M8 60 L8 50 Q8 46 12 46 L30 46 L38 32 Q39 30 42 30 L60 30 Q63 30 64 32 L72 46 L86 46 Q90 46 90 50 L90 60" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="8" y1="60" x2="90" y2="60" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    <line x1="51" y1="30" x2="51" y2="46" stroke="#000" stroke-width="3"/>
    <circle cx="28" cy="62" r="9" fill="#fff" stroke="#000" stroke-width="4"/>
    <circle cx="70" cy="62" r="9" fill="#fff" stroke="#000" stroke-width="4"/>`,
  plane:`<g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M10 50 Q6 44 18 43 L66 41 Q88 41 92 50 Q88 57 66 56 L18 55 Q8 55 10 50 Z"/>
    <path d="M16 43 L11 27 L28 42 Z"/>
    <path d="M44 50 L36 70 L58 70 L52 50 Z"/></g>
    <circle cx="34" cy="49" r="2.6" fill="#000"/><circle cx="45" cy="48" r="2.6" fill="#000"/><circle cx="56" cy="47" r="2.6" fill="#000"/>`,
  boat:`<g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="58"/>
    <path d="M50 16 L50 56 L82 56 Z"/>
    <path d="M46 20 L26 54 L46 54 Z"/>
    <path d="M12 60 L88 60 L77 78 L23 78 Z"/></g>
    <path d="M6 84 Q16 79 26 84 T46 84 T66 84 T86 84" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>`,
  rocket:`<g fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M50 8 Q67 30 64 56 L36 56 Q33 30 50 8 Z"/>
    <path d="M36 46 L21 66 L36 60 Z"/>
    <path d="M64 46 L79 66 L64 60 Z"/>
    <circle cx="50" cy="34" r="8" fill="#fff"/>
    <path d="M41 56 L50 82 L59 56" fill="none"/></g>`,
  // заглушка-рамка (если нужной картинки ещё нет в базе)
  placeholder:`<rect x="4" y="8" width="88" height="80" rx="10" fill="#fff" stroke="#000" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="48" y="44" text-anchor="middle" font-size="11" fill="#000">картинка</text>
    <text x="48" y="60" text-anchor="middle" font-size="11" fill="#000">из базы</text>`,
};
function icon(name){ return IK[name]||IK.placeholder; }

// --- ЛИСТ 1: ДОРОЖКИ «заведи мотор» --------------------------------
function buildMain(cfg){
  const snd=cfg.targetSound, low=snd.toLowerCase();
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<rect x="14" y="14" width="${W-28}" height="${H-28}" rx="26" fill="none" stroke="#000" stroke-width="2.5"/>`;
  // шапка
  s+=`<text x="${W/2}" y="76" text-anchor="middle" font-size="36" font-weight="bold">Автоматизация звука [${snd}]</text>`;
  s+=`<text x="${W/2}" y="114" text-anchor="middle" font-size="25">${cfg.subtitle}</text>`;
  s+=`<text x="${W/2}" y="144" text-anchor="middle" font-size="17" font-style="italic">${cfg.instruction}</text>`;
  s+=`<line x1="40" y1="162" x2="${W-40}" y2="162" stroke="#000" stroke-width="1.5"/>`;
  // дорожки
  const rows=cfg.rows.slice(0,cfg.rowCount||cfg.rows.length);
  const top=180, rowH=228, x0=176, x1=676;
  rows.forEach((r,i)=>{
    const bt=top+i*rowH, lineY=bt+94;
    s+=`<g transform="translate(40,${lineY-48})">${icon(r.icon)}</g>`;                     // иконка слева
    s+=`<path d="M150 ${lineY-8} L163 ${lineY} L150 ${lineY+8} Z" fill="#000"/>`;           // старт-стрелка
    s+=`<path d="${wavePath(r.wave,x0,x1,lineY)}" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`; // волна
    [0.18,0.42,0.66].forEach(t=>{                                                          // метки слогов над линией
      const mx=x0+(x1-x0)*t;
      s+=`<text x="${R(mx)}" y="${bt+32}" text-anchor="middle" font-size="22" font-weight="bold">${r.syllable}</text>`;
    });
    s+=`<rect x="690" y="${lineY-34}" width="70" height="68" rx="14" fill="#fff" stroke="#000" stroke-width="2.5"/>`; // бейдж-цель
    s+=`<text x="725" y="${lineY+14}" text-anchor="middle" font-size="38" font-weight="bold">${r.syllable}</text>`;
    s+=`<text x="${x0}" y="${bt+rowH-30}" font-size="14" fill="#555">тяни: ${low}-${low}-${low} — и назови «${r.syllable}»</text>`;
    if(i<rows.length-1) s+=`<line x1="40" y1="${bt+rowH-6}" x2="${W-40}" y2="${bt+rowH-6}" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 5"/>`;
  });
  s+=`<text x="${W/2}" y="${H-26}" text-anchor="middle" font-size="12" fill="#888">LogoKonspekt · рабочий лист · автоматизация [${snd}] · дорожки «заведи мотор»</text>`;
  s+=`</svg>`;
  return s;
}

// --- ЛИСТ 2: СЛОГОВОЕ ПОЛЕ-бродилка --------------------------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildField(cfg){
  const snd=cfg.targetSound, rng=mulberry32(0x10CA0729);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="${FONT}">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<rect x="14" y="14" width="${W-28}" height="${H-28}" rx="26" fill="none" stroke="#000" stroke-width="2.5"/>`;
  s+=`<text x="${W/2}" y="70" text-anchor="middle" font-size="30" font-weight="bold">Автоматизация звука [${snd}] · поле</text>`;
  s+=`<text x="${W/2}" y="102" text-anchor="middle" font-size="18">иди по кружкам от СТАРТА и называй слоги</text>`;
  // декор (морское дно, светло — не мешает)
  s+=`<path d="M40 128 Q80 118 120 128 T200 128 T280 128 T360 128 T440 128 T520 128 T600 128 T680 128 T754 128" fill="none" stroke="#bbb" stroke-width="2"/>`;
  s+=`<g stroke="#bbb" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M60 1090 Q50 1040 66 1010 Q78 1044 70 1090"/>
        <path d="M84 1090 Q96 1046 82 1012"/>
        <path d="M734 1090 Q744 1040 728 1010 Q716 1044 726 1090"/>
        <path d="M710 1090 Q700 1046 714 1012"/></g>`;
  s+=`<g fill="none" stroke="#bbb" stroke-width="2">
        <circle cx="150" cy="180" r="7"/><circle cx="176" cy="150" r="4"/>
        <circle cx="650" cy="200" r="8"/><circle cx="672" cy="172" r="5"/>
        <path d="M600 640 q22 -16 44 0 q-8 22 -22 22 q-14 0 -22 -22 z"/>
        <path d="M640 640 l16 -10 l0 20 z"/></g>`;
  // позиции кружков (сетка со случайным смещением, змейкой)
  const cols=[150,330,510,668], rowsY=[250,432,614,796];
  const pts=[];
  for(let r=0;r<rowsY.length;r++){
    const order=(r%2? [...cols].reverse():cols);
    order.forEach(cx=>pts.push({x:R(cx+(rng()*2-1)*32), y:R(rowsY[r]+(rng()*2-1)*30)}));
  }
  const use=pts.slice(0,cfg.fieldCount);
  // маршрут (пунктир)
  let route='M'+use[0].x+' '+use[0].y+' ';
  for(let i=1;i<use.length;i++) route+='L'+use[i].x+' '+use[i].y+' ';
  s+=`<path d="${route.trim()}" fill="none" stroke="#000" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.5"/>`;
  // кружки со слогами
  use.forEach((p,i)=>{
    const syl=cfg.fieldSyllables[i%cfg.fieldSyllables.length];
    s+=`<circle cx="${p.x}" cy="${p.y}" r="36" fill="#fff" stroke="#000" stroke-width="3"/>`;
    s+=`<text x="${p.x}" y="${p.y+8}" text-anchor="middle" font-size="${syl.length>2?20:24}" font-weight="bold">${syl}</text>`;
  });
  // СТАРТ (у первого кружка)
  const s0=use[0];
  s+=`<path d="M${s0.x-96} ${s0.y} L${s0.x-46} ${s0.y}" stroke="#000" stroke-width="3" stroke-linecap="round"/>`;
  s+=`<path d="M${s0.x-56} ${s0.y-9} L${s0.x-40} ${s0.y} L${s0.x-56} ${s0.y+9} Z" fill="#000"/>`;
  s+=`<text x="${s0.x-96}" y="${s0.y-14}" font-size="20" font-weight="bold">СТАРТ</text>`;
  s+=`<text x="${W/2}" y="${H-26}" text-anchor="middle" font-size="12" fill="#888">LogoKonspekt · рабочий лист · автоматизация [${snd}] · слоговое поле</text>`;
  s+=`</svg>`;
  return s;
}

// --- рендер + экспорт ----------------------------------------------
window.__mainSVG  = buildMain(CONFIG);
window.__fieldSVG = buildField(CONFIG);
window.__mainL    = buildMain(CONFIG_L);
function b64(str){return btoa(unescape(encodeURIComponent(str)));}
window.__b64=b64;

function card(svg,cap){const d=document.createElement('div');d.className='sheet';d.innerHTML=svg;const c=document.createElement('div');c.className='cap';c.textContent=cap;const box=document.createElement('div');box.appendChild(d);box.appendChild(c);return box;}
function render(){const wrap=document.createElement('div');wrap.className='wrap';document.body.appendChild(wrap);
  wrap.appendChild(card(window.__mainSVG,'ЛИСТ 1 — дорожки «заведи мотор» [Р]'));
  wrap.appendChild(card(window.__fieldSVG,'ЛИСТ 2 — слоговое поле [Р]'));
  wrap.appendChild(card(window.__mainL,'ДОКАЗАТЕЛЬСТВО: те же ~40 строк движка, CONFIG_L → лист [Л]'));}
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',render); else render();
</script>
