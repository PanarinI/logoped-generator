<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="/Users/igor/PycharmProjects/logoped-generator/web/app.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;
       background:radial-gradient(120% 130% at 12% 18%, #35785a 0%, #2f6b4f 42%, #1d4634 100%)}
  .left{position:absolute;left:64px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;opacity:.95}
  .brand span{font-weight:700;font-size:26px;letter-spacing:-.01em}
  h1{font-size:46px;line-height:1.1;margin:0 0 16px;letter-spacing:-.02em;font-weight:800}
  h1 em{display:block;font-style:normal;color:#ffd9a8}
  .sub{font-size:21px;line-height:1.35;margin:0 0 26px;color:#dbe8e0;max-width:490px}
  .foot{font-size:19px;color:#bcd3c6}
  .foot b{color:#fff}

  .paper{position:absolute;right:-52px;top:40px;width:452px;height:640px;background:#fff;
         border-radius:8px;overflow:hidden;transform:rotate(-3deg);
         box-shadow:0 26px 70px rgba(8,25,18,.42)}
  .paper img{position:absolute;left:0;top:0;width:452px}

  /* врезка — НАСТОЯЩИЙ элемент экрана: выбор звуков, которых у ребёнка нет.
     Разметка и стили те же, что в виджете (подключён его app.css). */
  .card{position:absolute;left:600px;bottom:44px;width:430px;background:#fff;
        border-radius:12px;padding:16px 18px 18px;color:var(--ink);
        box-shadow:0 20px 50px rgba(8,25,18,.5)}
  .card h2{font-size:15px;margin:0 0 4px}
  .card .hint{margin:0 0 10px;font-size:13px;color:var(--ink-3)}
  .card .chips{grid-template-columns:repeat(7,1fr);gap:4px}
  .card .chip{padding:7px 0;font-size:13px}
  .card .chips-note{margin-top:8px !important}
</style>

<div class="left">
  <div class="brand">
    <svg width="42" height="42" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#fff"/>
      <g fill="none" stroke="#2f6b4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 17h-6v30h6"/><path d="M46 17h6v30h-6"/></g>
      <text x="32" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#2f6b4f">р</text>
    </svg>
    <span>Логозвук</span>
  </div>
  <h1>Лист на автоматизацию звука<em>без слов, которые ребёнок не выговорит</em></h1>
  <p class="sub">Отмечаете звуки, которых у ребёнка ещё нет, — слова с ними на лист не попадают.</p>
  <div class="foot"><b>logozvuk.com</b> · бесплатно, без регистрации</div>
</div>

<div class="paper"><img src="/Users/igor/PycharmProjects/logoped-generator/web/img/list-r.png"></div>

<div class="card">
  <h2>Какие ещё звуки у ребёнка не получаются?</h2>
  <p class="hint">Слова с ними уберём.</p>
  <div class="chips">
    <button class="chip">С</button><button class="chip">З</button><button class="chip">Ц</button>
    <button class="chip is-on">Ш</button><button class="chip is-on">Ж</button>
    <button class="chip">Щ</button><button class="chip">Ч</button>
    <button class="chip" disabled>Л</button><button class="chip">Й</button><button class="chip">К</button>
    <button class="chip">Г</button><button class="chip">Х</button><button class="chip">П</button>
    <button class="chip">Б</button>
  </div>
  <p class="hint chips-note">Л — уже убраны: их путают с [Р].</p>
</div>
