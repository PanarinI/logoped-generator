<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;width:1200px;height:630px;overflow:hidden;position:relative;
       background:radial-gradient(120% 130% at 12% 18%, #35785a 0%, #2f6b4f 42%, #1d4634 100%);
       font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  .left{position:absolute;left:64px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;opacity:.95}
  .brand span{font-weight:700;font-size:26px;letter-spacing:-.01em}
  h1{font-size:52px;line-height:1.08;margin:0 0 14px;letter-spacing:-.02em;font-weight:800}
  h1 em{display:block;font-style:normal;color:#ffd9a8}
  p{font-size:22px;line-height:1.35;margin:0 0 26px;color:#dbe8e0;max-width:460px}

  /* лист — настоящий снимок, с тенью и лёгким наклоном */
  .paper{position:absolute;right:-40px;top:44px;width:470px;height:664px;background:#fff;
         border-radius:8px;overflow:hidden;transform:rotate(-3deg);
         box-shadow:0 26px 70px rgba(8,25,18,.42)}
  .paper img{position:absolute;left:0;top:0;width:470px}

  /* вырезка: увеличенный кусок того же листа с обведённым словом */
  /* вырезка: колонка «Ру» того же листа, крупно, с обведённым словом */
  .zoom{position:absolute;left:596px;bottom:52px;width:404px;height:214px;background:#fff;
        border-radius:10px;overflow:hidden;box-shadow:0 18px 46px rgba(8,25,18,.5);
        border:1px solid rgba(255,255,255,.55)}
  .zoom img{position:absolute;width:1017px;left:-524px;top:-360px}
  .ring{position:absolute;border:3px solid #c2553d;border-radius:50%;
        left:14px;top:138px;width:134px;height:40px}
</style>

        <path d="M18 17h-6v30h6"/><path d="M46 17h6v30h-6"/></g>
